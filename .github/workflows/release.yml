name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  YAZI_VERSION: "26.8.15"
  YAZI_ARCHIVE_SHA256: "451f6770999fa8f9b08e6c9f94a688c263b6d3007b0944c4407f1ae335eace30"

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUI-only binary
        run: cargo build --release

      - name: Package GUI-only release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\yazi-gui-$env:RELEASE_TAG-windows-x64"
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist\yazi-gui-$env:RELEASE_TAG-windows-x64.zip"
          New-Item -ItemType Directory -Force $stage | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage "assets") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage "assets\icons") | Out-Null
          Copy-Item "target\release\yazi-gui.exe" $stage
          Copy-Item "assets\yazi" (Join-Path $stage "assets\yazi") -Recurse
          Copy-Item "assets\icons\yazi-gui.svg" (Join-Path $stage "assets\icons\yazi-gui.svg")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force

      - name: Build bundled-yazi binary
        run: cargo build --release --features bundled-yazi

      - name: Download and verify yazi
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "yazi-$env:YAZI_VERSION-windows-x64.zip"
          $url = "https://github.com/sxyazi/yazi/releases/download/v$env:YAZI_VERSION/yazi-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:YAZI_ARCHIVE_SHA256) {
            throw "yazi archive SHA-256 mismatch: expected $env:YAZI_ARCHIVE_SHA256, got $actual"
          }
          $extract = Join-Path $env:RUNNER_TEMP "yazi-$env:YAZI_VERSION"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          "YAZI_EXTRACT=$extract\yazi-x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package bundled-yazi release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\yazi-gui-$env:RELEASE_TAG-windows-x64-bundled-yazi-$env:YAZI_VERSION"
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist\yazi-gui-$env:RELEASE_TAG-windows-x64-bundled-yazi-$env:YAZI_VERSION.zip"
          New-Item -ItemType Directory -Force $stage | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage "assets") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage "assets\icons") | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage "THIRD_PARTY_LICENSES") | Out-Null
          Copy-Item "target\release\yazi-gui.exe" $stage
          Copy-Item "assets\yazi" (Join-Path $stage "assets\yazi") -Recurse
          Copy-Item "assets\icons\yazi-gui.svg" (Join-Path $stage "assets\icons\yazi-gui.svg")
          Copy-Item (Join-Path $env:YAZI_EXTRACT "yazi.exe") $stage
          Copy-Item (Join-Path $env:YAZI_EXTRACT "ya.exe") $stage
          Copy-Item (Join-Path $env:YAZI_EXTRACT "LICENSE") (Join-Path $stage "THIRD_PARTY_LICENSES\yazi-LICENSE.txt")
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath "dist" -Filter "*.zip" |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath "dist" -File | Where-Object { $_.Extension -eq ".zip" -or $_.Name -eq "SHA256SUMS.txt" } | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG $assets --title "yazi-gui $env:RELEASE_TAG" --generate-notes
