[package]
name = "yazi-gui"
version = "0.1.0"
edition = "2024"
description = "A native GUI for the yazi terminal file manager, powered by GPUI and yazi's DDS event stream."

[dependencies]
gpui = "0.2.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "fs"] }
trash = { version = "3", default-features = false, features = ["coinit_multithreaded"] }
open = "5"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
