    </filter>
    <style>
      .title { font: 700 22px 'Segoe UI', sans-serif; letter-spacing: 2px; fill: #151a24; }
      .subtitle { font: 400 13px 'Segoe UI', sans-serif; fill: #687386; }
      .label { font: 600 12px 'Segoe UI', sans-serif; fill: #687386; }
      .dark-label { font: 600 12px 'Segoe UI', sans-serif; fill: #aeb8ca; }
      .dark-caption { font: 400 13px 'Segoe UI', sans-serif; fill: #e9efff; }
      .light-caption { font: 400 13px 'Segoe UI', sans-serif; fill: #151a24; }
      .button { fill: none; stroke: #cfd7e3; stroke-width: 1; }
      .dark-button { fill: none; stroke: #3b4658; stroke-width: 1; }
    </style>
  </defs>

